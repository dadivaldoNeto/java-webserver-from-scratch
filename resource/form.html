
<!--
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Envio - Localhost</title>
    <!-- Loading Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 p-8 transition-all duration-300 hover:shadow-2xl">
        
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-indigo-50 text-indigo-600 mb-4 shadow-sm">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Enviar Dados</h1>
            <p class="text-sm text-slate-500 mt-1">Submissão direta para <span class="font-mono text-xs bg-slate-100 text-indigo-600 px-2 py-0.5 rounded border border-slate-200">http://localhost:8080</span></p>
        </div>

        <form action="http://localhost:8080" method="POST" class="space-y-5" onsubmit="handleFormSubmit(event)">
            
            <!-- Name Field -->
            <div>
                <label for="name" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Nome Completo</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    </span>
                    <input type="text" id="name" name="name" required
                        class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all"
                        placeholder="Digite o seu nome">
                </div>
            </div>

            <!-- Email Field -->
            <div>
                <label for="email" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Endereço de E-mail</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    </span>
                    <input type="email" id="email" name="email" required
                        class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all"
                        placeholder="exemplo@dominio.com">
                </div>
            </div>

            <button type="submit" 
                class="w-full mt-2 py-3 px-4 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-medium text-sm rounded-xl shadow-lg shadow-indigo-500/30 hover:shadow-indigo-500/50 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/50">
                Submeter via POST
            </button>
        </form>

        <!-- Notification container (Replaces alert() usage) -->
        <div id="status-message" class="hidden mt-4 p-3 rounded-xl text-xs text-center font-medium"></div>

        <div class="mt-8 pt-6 border-t border-slate-100 text-center">
            <p class="text-xs text-slate-400">Certifique-se de que o seu servidor local em <span class="font-mono">localhost:8080</span> está ativo para receber a requisição.</p>
        </div>

    </div>

    <script>
        function handleFormSubmit(event) {
            // Se o servidor local não estiver rodando, o navegador mostrará erro de conexão padrão do form action.
            // Esta função apenas garante feedback visual customizado e seguro se necessário.
            const statusBox = document.getElementById('status-message');
            statusBox.className = "mt-4 p-3 rounded-xl text-xs text-center font-medium bg-amber-50 text-amber-700 border border-amber-200";
            statusBox.textContent = "A enviar requisição POST para http://localhost:8080...";
            statusBox.classList.remove('hidden');
        }
    </script>
</body>
</html>
